name: Bug report / Ошибка
description: Report a reproducible problem / Сообщить о воспроизводимой ошибке
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows / Версия программы и Windows
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Packet source / Источник пакетов
      options:
        - Auto
        - Network / Сеть
        - Client plaintext / Открытые пакеты клиента
        - Server bridge / Серверный мост
  - type: input
    id: profile
    attributes:
      label: Profile ID or Engine.dll SHA-256 / Профиль или SHA-256 Engine.dll
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / Шаги и ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result, status and screenshots / Фактический результат, статус и скриншоты
    validations:
      required: true

name: Verify repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile x86 native helpers
        shell: cmd
        run: |
          call packaging\build_drop.cmd
          if errorlevel 1 exit /b 1
          call packaging\build_tap.cmd
          if errorlevel 1 exit /b 1
      - name: Verify guides and resources
        run: python tools/verify_repository.py
      - name: Run logic and native adapter tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
